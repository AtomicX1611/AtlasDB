syntax = "proto3";

option java_multiple_files  = true;
option java_package          = "org.ds.proto";
option java_outer_classname  = "AtlasProto";

package org.ds.proto;

/**
 * Client-facing AtlasDB API.
 *
 * Design notes:
 *  - All write RPCs (Put, Delete) go through Raft consensus on the leader.
 *  - Read RPCs (Get) are served directly from the leader's state machine.
 *    Phase 5: upgrade to ReadIndex protocol for strict linearizable reads.
 *  - If a request hits a non-leader, the response carries a leader_hint
 *    (the node ID of the current known leader) so the client can redirect.
 *
 * Scalability note: leader_hint returns a node ID. In a Docker deployment,
 * the client resolves the ID to host:port via a separate service-discovery
 * mechanism (e.g., environment-variable peer map or Consul).
 */
service AtlasService {
  rpc Put       (PutRequest)       returns (PutResponse);
  rpc Get       (GetRequest)       returns (GetResponse);
  rpc Delete    (DeleteRequest)    returns (DeleteResponse);
  rpc BatchPut  (BatchPutRequest)  returns (BatchPutResponse);  // Phase 4
  rpc GetLeader (GetLeaderRequest) returns (GetLeaderResponse); // Phase 4 discovery
}

// ─── Put ───────────────────────────────────────────────────────────────────

message PutRequest {
  string key   = 1;
  string value = 2;
}

message PutResponse {
  bool   success     = 1;
  string error       = 2;  // empty on success; "NOT_LEADER" or error message on failure
  string leader_hint = 3;  // node ID of current leader when error == "NOT_LEADER"
}

// ─── Get ───────────────────────────────────────────────────────────────────

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value       = 1;  // value string, or empty string if not found
  bool   found       = 2;  // false if key doesn't exist
  string error       = 3;
  string leader_hint = 4;
}

// ─── Delete ────────────────────────────────────────────────────────────────

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool   deleted     = 1;  // true if key existed and was removed
  string error       = 2;
  string leader_hint = 3;
}

// ─── BatchPut (Phase 4) ────────────────────────────────────────────────────

message KVPair {
  string key   = 1;
  string value = 2;
}

message BatchPutRequest {
  repeated KVPair pairs = 1;
}

message BatchPutResponse {
  int32  success_count = 1;  // how many pairs were committed
  int32  fail_count    = 2;
  string error         = 3;
  string leader_hint   = 4;  // populated when error == "NOT_LEADER"
}

// ─── GetLeader (Phase 4 — used by smart client for discovery) ─────────────

message GetLeaderRequest {}

message GetLeaderResponse {
  string leader_id   = 1;  // node ID of current leader ("" if no leader yet)
  string leader_host = 2;
  int32  leader_port = 3;
}
